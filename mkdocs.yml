site_name: The Glass Cannon Project
site_description: >-
  A patient-and-family-led research effort to characterize heterozygous
  SAMHD1 p.A565T — mechanism, kindred, objectives, and weekly literature
  surveillance.
site_url: !ENV [SITE_URL, "https://example.github.io/glass-cannon/"]

theme:
  name: material
  custom_dir: overrides          # <-- NEW
  logo: assets/mark.png          # <-- was assets/logo.svg
  favicon: assets/mark.png       # <-- was assets/logo.svg
  palette:
    # Single dark scheme. The redesign is dark-first; a light variant of
    # the atlases does not exist, so a light site scheme only creates a
    # jarring transition when a reader clicks through to one.
    - scheme: slate
      primary: black
      accent: deep orange
  font: false                    # fonts come from overrides/main.html
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:                       # <-- NEW
  - stylesheets/glasscannon.css

nav:
  - Home: index.md
  - The Variant: samhd1.md
  - Atlases:
      - Function Atlas: samhd1-atlas.md
      - Immune Atlas: immune-atlas.md
  - The Kindred: kindred.md
  - For Clinicians: clinicians.md     # <-- NEW
  - Research Blog:
      - blog/index.md
      - Tags: tags.md
  - Foundation: foundation.md

# REMOVED from nav (content preserved, see notes in SHIP.md):
#   pathways.md   -> folded into the Immune Atlas page
#   objectives.md -> compressed into the homepage "What we're trying to do" block

plugins:
  - search
  - awesome-pages
  - tags
  - blog:
      blog_dir: blog
      post_url_format: "{date}/{slug}"
      post_date_format: long
      archive_date_format: MMMM yyyy
  - rss:
      match_path: blog/posts/.*
      image: https://glasscannonfoundation.org/assets/mark.png
      date_from_meta:
        as_creation: date
      categories:
        - categories

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/solid/rss
      link: feed_rss_created.xml
      name: RSS feed
    - icon: fontawesome/solid/envelope
      link: mailto:contact@glasscannonfoundation.org
      name: contact@glasscannonfoundation.org
